# Apenas para testar no seu computador.
# Em produção, cada serviço roda como um App separado no Easypanel (veja o README).
name: visaorenovada

services:
  site:
    build:
      context: .
      dockerfile: services/site/Dockerfile
    ports:
      - "8081:80"

  app:
    build:
      context: .
      dockerfile: services/app/Dockerfile
    ports:
      - "8082:80"
