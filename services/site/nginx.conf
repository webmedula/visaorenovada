server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Domínio sem www -> www (o Easypanel encaminha os dois domínios para este serviço)
    if ($host = visaorenovada.com.br) {
        return 301 https://www.visaorenovada.com.br$request_uri;
    }

    # Endereço impresso no livro (Bônus 2)
    location = /bonus2 { return 302 https://app.visaorenovada.com.br/avaliacao/; }
    location = /app { return 302 https://app.visaorenovada.com.br/; }

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Arquivos estáticos: cache curto (sem hash no nome)
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
