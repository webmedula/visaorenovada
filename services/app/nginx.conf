server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Arquivos estáticos do app de exercícios: cache curto (sem hash no nome)
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Autoavaliação (React, build do Vite com base /avaliacao/)
    location = /avaliacao { return 301 /avaliacao/; }
    location /avaliacao/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /avaliacao/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /avaliacao/index.html;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
