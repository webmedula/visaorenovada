server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Arquivos estáticos do app de exercícios: cache curto (sem hash no nome)
    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Autoavaliação (React, build do Vite com base /avaliacao/)
    location = /avaliacao { return 301 /avaliacao/; }
    location /avaliacao/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /avaliacao/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /avaliacao/index.html;
    }

    # Receitas (conteúdo pago): exige o código de acesso. O app envia o código
    # via cabeçalho Authorization; sem ele, responde 401 sem abrir o diálogo do navegador.
    location /receitas/ {
        auth_basic "Receitas Visão Renovada";
        auth_basic_user_file /etc/nginx/receitas.htpasswd;
        add_header Cache-Control "no-store";
        error_page 401 = @receitas_401;
        try_files $uri =404;
    }
    location @receitas_401 {
        add_header Cache-Control "no-store";
        return 401 "codigo invalido";
    }

    # Exercícios, plano e pausas (conteúdo do livro): exige o código do app,
    # entregue na área de membros da Kiwify. Mesmo esquema das receitas.
    location /conteudo/ {
        auth_basic "App Visão Renovada";
        auth_basic_user_file /etc/nginx/app.htpasswd;
        add_header Cache-Control "no-store";
        error_page 401 = @conteudo_401;
        try_files $uri =404;
    }
    location @conteudo_401 {
        add_header Cache-Control "no-store";
        return 401 "codigo invalido";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ /index.html;
    }
}
